services:
  tileserver:
    image: ${TILESERVER_IMAGE:-maptiler/tileserver-gl:latest}
    command: ["-c", "config.json"]
    ports:
      - "${TILESERVER_PORT:-8080}:8080"
    volumes:
      - ./tileserver/config.json:/data/config.json:ro
      - ./tileserver/styles:/data/styles:ro
      - ./tileserver/fonts:/data/fonts:ro
      - ./tileserver/sprites:/data/sprites:ro
      - ./tileserver/icons:/data/icons:ro
      - ./tileserver/files:/data/files:ro
      - ./data/mbtiles:/data/data:ro
    restart: unless-stopped

  viewer:
    image: nginx:alpine
    ports:
      - "${VIEWER_PORT:-8081}:80"
    volumes:
      - ./viewer:/usr/share/nginx/html:ro
    depends_on:
      - tileserver
    restart: unless-stopped

  planetiler:
    image: ${PLANETILER_IMAGE:-ghcr.io/onthegomap/planetiler:latest}
    profiles: ["generate"]
    environment:
      JAVA_TOOL_OPTIONS: ${PLANETILER_JAVA_OPTS:--Xmx4g}
    volumes:
      - ./data:/data
